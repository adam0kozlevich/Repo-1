<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212B">
<title>Logbook</title>
<style>
:root{
  --bg:#E8ECEF; --card:#FBFCFD; --ink:#17212B; --muted:#5F6B79; --line:#CBD3DB;
  --accent:#2447D6; --accent-soft:#DCE4FF; --danger:#B3261E;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(20px + env(safe-area-inset-top)) 0 14px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.week{margin:2px 0 0;color:var(--muted);font-size:14px}
h2{font-size:15px;font-weight:700;margin:26px 0 10px;color:var(--ink)}
h3{margin:0;font-size:17px;font-weight:700}
.view{display:none}.view.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.field{display:block;margin-bottom:14px;min-width:0}
.field.grow{flex:1 1 180px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;color:inherit}
.field input,.field select,.pill-input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:46px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:-4px 0 14px;font-size:14px}
.hint b{font-weight:700}
.hint button{margin-top:6px}
.sets{margin:4px 0 8px;border-top:1px solid var(--line)}
.set{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.set .n{width:22px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.set .f{flex:1;position:relative;min-width:0}
.set .f input{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 40px 4px 4px;min-height:44px;border-radius:8px}
.set .f input:focus{background:#fff}
.set .f small{position:absolute;right:6px;bottom:9px;color:var(--muted);font-size:12px;pointer-events:none}
.set .x{color:var(--muted);font-size:20px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:16px;border-radius:10px;cursor:pointer}
.icon:hover{background:#EDF0F3}
button{font:inherit;cursor:pointer}
.primary{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;margin-top:4px}
.primary:active{filter:brightness(.92)}
.ghost{min-height:44px;width:100%;margin:6px 0 16px;border:1px dashed var(--muted);background:transparent;border-radius:10px;color:var(--ink);font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 10px 8px 0;min-height:40px}
.link.danger{color:var(--danger)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.entry .sets-line{margin:6px 0 0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.5}
.entry .note{margin:4px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:10px;margin-top:4px}
.empty{color:var(--muted);padding:6px 2px}
.day{font-size:14px;font-weight:700;margin:22px 0 8px;color:var(--muted)}
.pill-input{margin-bottom:6px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ex>button{width:100%;text-align:left;border:0;background:none;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px}
.ex .meta{color:var(--muted);font-size:14px;margin-top:2px}
.ex .cnt{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.ex .body{padding:0 16px 14px}
.ex svg{width:100%;height:auto;display:block;margin-top:8px}
.ex .axis{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:10px}
.btn{min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:600;padding:0 14px;color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center}
.btn.danger{color:var(--danger)}
.small{color:var(--muted);font-size:13px;margin:6px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{display:flex;gap:4px;width:100%;max-width:560px}
nav button{flex:1;min-height:48px;border:0;background:transparent;color:#AEB9C5;font-weight:600;font-size:14px;border-radius:10px}
nav button[aria-current=page]{background:#2A3744;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Logbook</h1>
    <p class="week" id="weekline"></p>
  </header>

  <main>
    <section id="v-log" class="view on">
      <div class="panel">
        <div class="row2">
          <label class="field"><span>Date</span><input type="date" id="date"></label>
          <label class="field grow"><span>Exercise</span><input id="exercise" list="exlist" autocomplete="off" autocapitalize="sentences" placeholder="e.g. Back squat"></label>
        </div>
        <datalist id="exlist"></datalist>
        <div id="hint" class="hint" hidden></div>
        <div id="sets" class="sets"></div>
        <button class="ghost" data-act="addset">Add set</button>
        <label class="field"><span>Notes</span><input id="note" placeholder="How it felt, tempo, gear"></label>
        <button class="primary" data-act="save">Save exercise</button>
      </div>
      <h2 id="todayh">Logged on this date</h2>
      <div id="today"></div>
    </section>

    <section id="v-history" class="view">
      <input class="pill-input" id="filter" type="search" placeholder="Filter by exercise" aria-label="Filter by exercise">
      <div id="history"></div>
    </section>

    <section id="v-progress" class="view">
      <div id="progress"></div>
    </section>

    <section id="v-data" class="view">
      <div class="panel">
        <label class="field"><span>Weight unit</span>
          <select id="unit"><option value="kg">kg</option><option value="lb">lb</option></select>
        </label>
        <p class="small" style="margin-top:-6px">Changing the unit relabels your numbers. It does not convert them.</p>
      </div>
      <h2>Back up and restore</h2>
      <div class="stack">
        <button class="btn" data-act="export-json">Download backup (JSON)</button>
        <button class="btn" data-act="export-csv">Download spreadsheet (CSV)</button>
        <label class="btn" for="file">Restore from backup</label>
        <input type="file" id="file" accept="application/json,.json" hidden>
        <button class="btn danger" data-act="wipe">Delete all data</button>
      </div>
      <p class="small">Your log is stored in this browser on this device. Download a backup now and then, and use it to move to a new phone or browser.</p>
    </section>
  </main>
</div>

<nav aria-label="Sections"><div class="in">
  <button data-tab="log" aria-current="page">Log</button>
  <button data-tab="history">History</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="data">Data</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'logbook-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmt = n => String(Math.round(n * 10) / 10);
const niceDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const shortDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric'});

let db = {entries: [], unit: 'kg'};
let draft = blank(today());
let openEx = null;

function blank(date){ return {date, exercise:'', sets:[{w:'', r:''}], note:''}; }

/* ---------- storage (window.storage if present, else localStorage) ---------- */
async function load(){
  try { if (window.storage) { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); } } catch(e){}
  try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
  return null;
}
async function persist(){
  const s = JSON.stringify(db);
  try { if (window.storage) { await window.storage.set(KEY, s, false); return; } } catch(e){}
  try { localStorage.setItem(KEY, s); } catch(e){ flash('Could not save. Browser storage is blocked.'); }
}

/* ---------- helpers ---------- */
const sorted = () => [...db.entries].sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
const e1rm = s => (s.w > 0 && s.r > 0) ? s.w * (1 + s.r / 30) : 0;
const setText = s => (s.w > 0 ? fmt(s.w) : 'BW') + ' × ' + s.r;
const sum = sets => sets.map(setText).join(',  ');
const lastFor = name => { const k = name.trim().toLowerCase(); return k ? sorted().find(e => e.exercise.toLowerCase() === k) || null : null; };

let toastT;
function flash(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Log view ---------- */
function renderSets(){
  $('#sets').innerHTML = draft.sets.map((s, i) => `
    <div class="set" data-i="${i}">
      <span class="n">${i + 1}</span>
      <label class="f"><input inputmode="decimal" data-k="w" value="${esc(s.w)}" placeholder="0" aria-label="Weight, set ${i + 1}"><small>${db.unit}</small></label>
      <span class="x" aria-hidden="true">×</span>
      <label class="f"><input inputmode="numeric" data-k="r" value="${esc(s.r)}" placeholder="0" aria-label="Reps, set ${i + 1}"><small>reps</small></label>
      <button class="icon" data-act="rmset" data-i="${i}" aria-label="Remove set ${i + 1}">✕</button>
    </div>`).join('');
}
function renderHint(){
  const last = lastFor(draft.exercise), h = $('#hint');
  if (!last) { h.hidden = true; return; }
  h.hidden = false;
  h.innerHTML = `<b>Last time, ${esc(shortDate(last.date))}:</b> ${esc(sum(last.sets))}<br><button class="link" data-act="usesets" data-id="${last.id}">Use these sets</button>`;
}
function entryCard(e){
  return `<article class="entry">
    <h3>${esc(e.exercise)}</h3>
    <p class="sets-line">${esc(sum(e.sets))}</p>
    ${e.note ? `<p class="note">${esc(e.note)}</p>` : ''}
    <div class="acts">
      <button class="link" data-act="repeat" data-id="${e.id}">Repeat</button>
      <button class="link danger" data-act="del" data-id="${e.id}">Delete</button>
    </div></article>`;
}
function renderToday(){
  const list = sorted().filter(e => e.date === draft.date);
  $('#todayh').textContent = draft.date === today() ? 'Logged today' : 'Logged on ' + shortDate(draft.date);
  $('#today').innerHTML = list.length ? list.map(entryCard).join('') : '<p class="empty">Nothing logged for this date yet.</p>';
}
function renderWeek(){
  const t = new Date(today() + 'T00:00:00'), days = new Set();
  db.entries.forEach(e => { const d = Math.round((t - new Date(e.date + 'T00:00:00')) / 864e5); if (d >= 0 && d < 7) days.add(e.date); });
  $('#weekline').textContent = days.size ? `${days.size} training day${days.size > 1 ? 's' : ''} in the last 7` : 'No sessions in the last 7 days';
}
function renderLog(){
  $('#date').value = draft.date;
  $('#exercise').value = draft.exercise;
  $('#note').value = draft.note;
  const names = [...new Set(sorted().map(e => e.exercise))];
  $('#exlist').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  renderSets(); renderHint(); renderToday(); renderWeek();
}

function saveEntry(){
  const name = $('#exercise').value.trim().replace(/\s+/g, ' ');
  if (!name) { flash('Add an exercise name first.'); $('#exercise').focus(); return; }
  const sets = draft.sets
    .map(s => ({w: parseFloat(String(s.w).replace(',', '.')) || 0, r: parseInt(s.r, 10) || 0}))
    .filter(s => s.r > 0);
  if (!sets.length) { flash('Enter reps for at least one set.'); return; }
  const same = db.entries.find(e => e.exercise.toLowerCase() === name.toLowerCase());
  db.entries.push({id: uid(), ts: Date.now(), date: draft.date, exercise: same ? same.exercise : name, sets, note: draft.note.trim()});
  persist();
  draft = blank(draft.date);
  renderLog();
  flash('Saved ' + (same ? same.exercise : name));
}

/* ---------- History ---------- */
function renderHistory(){
  const q = $('#filter').value.trim().toLowerCase();
  const list = sorted().filter(e => !q || e.exercise.toLowerCase().includes(q));
  if (!list.length) { $('#history').innerHTML = `<p class="empty">${db.entries.length ? 'No matches.' : 'Your saved exercises will show up here.'}</p>`; return; }
  let out = '', cur = '';
  list.forEach(e => {
    if (e.date !== cur) { cur = e.date; out += `<div class="day">${esc(niceDate(cur))}</div>`; }
    out += entryCard(e);
  });
  $('#history').innerHTML = out;
}

/* ---------- Progress ---------- */
function spark(series, unit, weighted){
  if (series.length < 2) return '<p class="small">Log this exercise on another day to see a trend.</p>';
  const W = 300, H = 90, P = 10;
  const vs = series.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs);
  const pts = series.map((p, i) => [P + i / (series.length - 1) * (W - 2 * P), H - P - (p.v - min) / ((max - min) || 1) * (H - 2 * P)]);
  const lbl = weighted ? `Estimated 1RM (${unit})` : 'Best reps in a set';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lbl)} over time">
    <polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#2447D6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#2447D6"/>`).join('')}</svg>
    <div class="axis"><span>${esc(shortDate(series[0].date))}: ${fmt(series[0].v)}</span><span>${esc(shortDate(series[series.length - 1].date))}: ${fmt(series[series.length - 1].v)}</span></div>
    <p class="small">${esc(lbl)}, best set per day</p>`;
}
function renderProgress(){
  const map = {};
  db.entries.forEach(e => { (map[e.exercise.toLowerCase()] ||= {name: e.exercise, items: []}).items.push(e); });
  const list = Object.values(map).sort((a, b) => b.items.length - a.items.length);
  if (!list.length) { $('#progress').innerHTML = '<p class="empty">Save a few workouts to see your best sets and trends.</p>'; return; }
  $('#progress').innerHTML = list.map(x => {
    const all = x.items.flatMap(e => e.sets);
    const weighted = all.some(s => s.w > 0);
    let best;
    if (weighted) { const b = all.reduce((m, s) => e1rm(s) > e1rm(m) ? s : m, all[0]); best = `Best set ${fmt(b.w)} ${db.unit} × ${b.r}, est. 1RM ${fmt(e1rm(b))} ${db.unit}`; }
    else best = `Most reps in a set: ${Math.max(...all.map(s => s.r))}`;
    const byDay = {};
    x.items.forEach(e => { const v = weighted ? Math.max(...e.sets.map(e1rm)) : Math.max(...e.sets.map(s => s.r)); byDay[e.date] = Math.max(byDay[e.date] || 0, v); });
    const series = Object.keys(byDay).sort().map(d => ({date: d, v: byDay[d]}));
    const open = openEx === x.name.toLowerCase();
    return `<div class="ex"><button data-act="toggle" data-name="${esc(x.name.toLowerCase())}" aria-expanded="${open}">
      <span><strong>${esc(x.name)}</strong><div class="meta">${esc(best)}</div></span><span class="cnt">${x.items.length}</span></button>
      ${open ? `<div class="body">${spark(series, db.unit, weighted)}</div>` : ''}</div>`;
  }).join('');
}

/* ---------- Data ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCSV(){
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['date','exercise','set','weight','reps','unit','note']];
  [...db.entries].sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts)
    .forEach(e => e.sets.forEach((s, i) => rows.push([e.date, e.exercise, i + 1, s.w, s.r, db.unit, e.note])));
  download('logbook.csv', rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}

/* ---------- navigation + events ---------- */
function showTab(t){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('nav button').forEach(b => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (t === 'history') renderHistory();
  if (t === 'progress') renderProgress();
  if (t === 'log') renderLog();
  window.scrollTo(0, 0);
}
function renderAll(){ renderLog(); renderHistory(); renderProgress(); $('#unit').value = db.unit; }

document.addEventListener('click', ev => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) { showTab(tabBtn.dataset.tab); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'addset') {
    const p = draft.sets[draft.sets.length - 1] || {w:'', r:''};
    draft.sets.push({w: p.w, r: p.r}); renderSets();
  } else if (act === 'rmset') {
    draft.sets.splice(+el.dataset.i, 1); if (!draft.sets.length) draft.sets.push({w:'', r:''}); renderSets();
  } else if (act === 'save') saveEntry();
  else if (act === 'usesets') {
    const e = db.entries.find(x => x.id === id); if (!e) return;
    draft.sets = e.sets.map(s => ({w: s.w || '', r: s.r})); renderSets();
  } else if (act === 'repeat') {
    const e = db.entries.find(x => x.id === id); if (!e) return;
    draft = {date: today(), exercise: e.exercise, sets: e.sets.map(s => ({w: s.w || '', r: s.r})), note: ''};
    showTab('log'); flash('Loaded. Adjust and save.');
  } else if (act === 'del') {
    if (!confirm('Delete this entry?')) return;
    db.entries = db.entries.filter(x => x.id !== id); persist(); renderToday(); renderWeek(); renderHistory(); renderProgress(); renderHint();
  } else if (act === 'toggle') {
    openEx = openEx === el.dataset.name ? null : el.dataset.name; renderProgress();
  } else if (act === 'export-json') download('logbook-backup.json', JSON.stringify(db, null, 2), 'application/json');
  else if (act === 'export-csv') exportCSV();
  else if (act === 'wipe') {
    if (!confirm('Delete every entry? This cannot be undone.')) return;
    if (!confirm('Last check: delete all data?')) return;
    db.entries = []; persist(); draft = blank(today()); renderAll(); flash('All data deleted.');
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('.set input')) { draft.sets[+t.closest('.set').dataset.i][t.dataset.k] = t.value; }
  else if (t.id === 'exercise') { draft.exercise = t.value; renderHint(); }
  else if (t.id === 'note') draft.note = t.value;
  else if (t.id === 'date') { draft.date = t.value || today(); renderToday(); }
  else if (t.id === 'filter') renderHistory();
});
$('#unit').addEventListener('change', e => { db.unit = e.target.value; persist(); renderAll(); flash('Unit set to ' + db.unit); });
$('#file').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), arr = Array.isArray(j) ? j : j.entries;
    if (!Array.isArray(arr)) throw new Error('bad');
    const ids = new Set(db.entries.map(e => e.id)); let n = 0;
    arr.forEach(e => {
      if (e && e.exercise && e.date && Array.isArray(e.sets) && !ids.has(e.id)) {
        db.entries.push({id: e.id || uid(), ts: e.ts || Date.now(), date: String(e.date), exercise: String(e.exercise),
          sets: e.sets.map(s => ({w: +s.w || 0, r: +s.r || 0})), note: e.note ? String(e.note) : ''});
        n++;
      }
    });
    if (j.unit && !Array.isArray(j) && !db.entries.length) db.unit = j.unit;
    persist(); renderAll(); flash(`Restored ${n} entr${n === 1 ? 'y' : 'ies'}.`);
  } catch (e) { flash('That file is not a Logbook backup.'); }
  ev.target.value = '';
});

(async function init(){
  const saved = await load();
  if (saved && Array.isArray(saved.entries)) db = {entries: saved.entries, unit: saved.unit === 'lb' ? 'lb' : 'kg'};
  renderAll();
})();
</script>
</body>
</html>
